name: Build CELT Multi-Arch Static Libraries

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-all:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Toolchains & Multilib Compilers
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc gcc-multilib \
          gcc-mingw-w64-i686 gcc-mingw-w64-x86-64 \
          make

    - name: Build Windows 32-bit (celt32.lib)
      run: |
        make OS=windows ARCH=x86
        make clean

    - name: Build Windows 64-bit (celt64.lib)
      run: |
        make OS=windows ARCH=x64
        make clean

    - name: Build Linux 32-bit (libcelt32.a)
      run: |
        make OS=linux ARCH=x86
        make clean

    - name: Build Linux 64-bit (libcelt64.a)
      run: |
        make OS=linux ARCH=x64

    - name: Upload All CELT Libraries
      uses: actions/upload-artifact@v4
      with:
        name: celt-static-libraries
        path: |
          celt32.lib
          celt64.lib
          libcelt32.a
          libcelt64.a
