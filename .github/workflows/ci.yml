name: Build 32-bit Windows Static Library

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-win32:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout CELT repo
      uses: actions/checkout@v4

    - name: Install MinGW 32-bit Toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-mingw-w64-i686 make

    - name: Build static library
      run: |
        make

    - name: Upload celt32.lib Artifact
      uses: actions/upload-artifact@v4
      with:
        name: celt32-win32-lib
        path: celt32.lib
