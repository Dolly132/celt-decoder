name: Build CELT Multi-Arch Static Libraries

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build CELT x86 (MSVC)
        run: |
          cl.exe /c /O2 /MT /DHAVE_CONFIG_H /DCUSTOM_MODES /D_CRT_SECURE_NO_WARNINGS /D_CRT_SECURE_NO_DEPRECATE /D_CRT_NONSTDC_NO_DEPRECATE /Iinclude /Isrc src/*.c
          lib.exe /OUT:celt32.lib *.obj
          del *.obj

      - name: Set up Developer Command Prompt (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build CELT x64 (MSVC)
        run: |
          cl.exe /c /O2 /MT /DHAVE_CONFIG_H /DCUSTOM_MODES /D_CRT_SECURE_NO_WARNINGS /D_CRT_SECURE_NO_DEPRECATE /D_CRT_NONSTDC_NO_DEPRECATE /Iinclude /Isrc src/*.c
          lib.exe /OUT:celt64.lib *.obj
          del *.obj

      - name: Upload Windows Libraries
        uses: actions/upload-artifact@v4
        with:
          name: celt-windows-libs
          path: |
            celt32.lib
            celt64.lib
