name: build-celt-windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'include/**'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Compile CELT sources
        shell: cmd
        run: |
          mkdir obj
          for %%f in (bands.c celt.c cwrs.c entcode.c entdec.c entenc.c header.c kiss_fft.c laplace.c mathops.c mdct.c modes.c pitch.c plc.c quant_bands.c rate.c static_modes_fixed.c static_modes_float.c vq.c) do (
            cl /c /O2 /MT /DHAVE_CONFIG_H /DCELT_BUILD /Isrc /Iinclude /Fo:obj\%%~nf.obj src\%%f
            if errorlevel 1 exit /b 1
          )

      - name: Archive into static lib
        shell: cmd
        run: lib /OUT:celt.lib obj\*.obj

      - uses: actions/upload-artifact@v4
        with:
          name: celt-windows-x86
          path: celt.lib
