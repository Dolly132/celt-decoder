name: Build 32-bit Windows Binary

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-win32:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install MinGW 32-bit Compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-mingw-w64-i686 make

    - name: Build CELT for Win32
      run: |
        make CC=i686-w64-mingw32-gcc

    - name: Upload Windows Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: celt-win32-binary
        path: celt32.dll  # Change to celt32.exe if compiling an executable
